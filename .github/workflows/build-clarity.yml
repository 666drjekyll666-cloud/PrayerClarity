name: Build PrayerClarity candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/**'

permissions:
  contents: read

concurrency:
  group: prayerclarity-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.csproj -c Release --no-restore
      - name: Verify embedded locales and stage artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/Release/PrayerClarity.dll'
          test -f "$dll"
          for locale in en fr de zh_cn es pt_br ko ja ru it pl; do
            grep -a -q ".lang.${locale}.json" "$dll" || {
              echo "Embedded locale marker missing: ${locale}" >&2
              exit 1
            }
          done
          mkdir -p dist
          asset='PrayerClarity-1.0.4-ci.dll'
          cp "$dll" "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "DLL: $asset"
            echo "SHA-256: $hash"
            echo "Supported game MVID: 6f50b8e7-156b-49ac-bbe8-7505894b2364"
            echo "Locales: en fr de zh_cn es pt_br ko ja ru it pl"
          } > dist/BUILD_INFO.txt
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity candidate SHA-256: $hash"
      - name: Upload candidate build evidence
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-1.0.4-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.asset }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
