name: Build PrayerClarity audit probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/initial-audit
    paths:
      - 'PrayerClarity.AuditProbe.csproj'
      - 'src/PrayerClarityBridgeProbe.cs'
      - '.github/workflows/audit-probe.yml'

permissions:
  contents: read

concurrency:
  group: prayerclarity-audit-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.AuditProbe.csproj
      - name: Build probe DLL
        run: dotnet build PrayerClarity.AuditProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='PrayerClarity.AuditProbe.0.1.5.dll'
          cp 'bin/Probe/PrayerClarity.AuditProbe.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity audit probe 0.1.5 SHA-256: $hash"
      - name: Upload probe DLL
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-AuditProbe-0.1.5
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
