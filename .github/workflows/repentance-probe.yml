name: Build PrayerClarity Repentance probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/rework-audit-2026-09-16
    paths:
      - 'PrayerClarity.RepentanceProbe.csproj'
      - 'src/PrayerClarityRepentanceProbe.cs'
      - '.github/workflows/repentance-probe.yml'

permissions:
  contents: read

concurrency:
  group: prayerclarity-repentance-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.RepentanceProbe.csproj
      - name: Build probe DLL
        run: dotnet build PrayerClarity.RepentanceProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='PrayerClarity.RepentanceProbe.0.1.0.dll'
          cp 'bin/RepentanceProbe/PrayerClarity.RepentanceProbe.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity Repentance probe 0.1.0 SHA-256: $hash"
      - name: Upload probe DLL
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-RepentanceProbe-0.1.0
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
