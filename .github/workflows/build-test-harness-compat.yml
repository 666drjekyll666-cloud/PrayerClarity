name: Build PrayerClarity Test Harness Rebalanced compatibility

on:
  push:
    branches:
      - 'candidate/test-harness-rebalanced-compat-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-test-harness-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.TestHarness.RebalancedCompat.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.TestHarness.RebalancedCompat.csproj -c Release --no-restore
      - name: Stage compatibility DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/TestHarnessCompat/PrayerClarity.TestHarness.RebalancedCompat.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.TestHarness.RebalancedCompat-0.1.0-ci.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo "Version: 0.1.0"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo "Purpose: satisfy the legacy Test Harness hard dependency on the Vanilla PrayerClarity GUID while requiring PrayerClarity: Rebalanced to load first."
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Upload compatibility candidate
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-TestHarness-RebalancedCompat-0.1.0-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
