name: Publish accepted PrayerClarity 0.1.21

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-0.1.21.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACCEPTED_SHA: ccfa329813233ea02482808a38bcb483ff844310
      EXPECTED_SHA256: bd77adbf36658146132a81452f14753e972e75e893acf05df50b7c04ae3cad06
    steps:
      - name: Download exact accepted candidate artifact
        uses: actions/download-artifact@v4
        with:
          repository: 666drjekyll666-cloud/PrayerClarity
          run-id: 35031015516
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-0.1.21-ci-ccfa329813233ea02482808a38bcb483ff844310
          path: dist

      - name: Verify accepted bytes
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/PrayerClarity-0.1.21-ci.dll
          actual=$(sha256sum dist/PrayerClarity-0.1.21-ci.dll | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          cp dist/PrayerClarity-0.1.21-ci.dll dist/PrayerClarity.dll

      - name: Publish stable release without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.21 --repo 666drjekyll666-cloud/PrayerClarity >/dev/null 2>&1; then
            echo 'v0.1.21 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.1.21 dist/PrayerClarity.dll \
            --repo 666drjekyll666-cloud/PrayerClarity \
            --target "$ACCEPTED_SHA" \
            --title 'PrayerClarity 0.1.21 — Clarity baseline' \
            --notes 'Accepted Clarity-only baseline for Graveyard Keeper 1.407. Improves prayer information at the pulpit, Technology tooltips, and Character -> Temporary Effects. Includes all 11 supported UI languages. No prayer balance or gameplay mechanics are changed.'
