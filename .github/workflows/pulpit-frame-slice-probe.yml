name: Build PrayerClarity pulpit frame slice probe

on:
  push:
    branches:
      - 'candidate/pulpit-frame-slice-probe-*'
    paths:
      - 'PrayerClarity.PulpitFrameSliceProbe.csproj'
      - 'src/PrayerClarityPulpitFrameSliceProbe.cs'
      - '.github/workflows/pulpit-frame-slice-probe.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PrayerClarity.PulpitFrameSliceProbe.csproj
      - run: dotnet build PrayerClarity.PulpitFrameSliceProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='PrayerClarity.PulpitFrameSliceProbe.0.1.0.dll'
          cp 'bin/PulpitFrameSliceProbe/PrayerClarity.PulpitFrameSliceProbe.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-PulpitFrameSliceProbe-0.1.0-${{ github.sha }}
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
