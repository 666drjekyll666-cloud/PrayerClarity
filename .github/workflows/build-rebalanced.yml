name: Build PrayerClarity Rebalanced

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/rebalanced-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-rebalanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore sibling projects
        run: |
          dotnet restore PrayerClarity.Rebalanced.csproj
          dotnet restore PrayerClarity.csproj
      - name: Build Rebalanced
        run: dotnet build PrayerClarity.Rebalanced.csproj -c Release --no-restore
      - name: Verify Vanilla shared-source build
        run: dotnet build PrayerClarity.csproj -c Release --no-restore
