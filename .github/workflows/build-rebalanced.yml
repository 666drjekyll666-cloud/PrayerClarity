name: Build PrayerClarity shared candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/rebalanced-*'
      - '!candidate/rebalanced-test-console-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate localization JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          required_base = {
              'forecast.current_success_chance',
              'repose.endpoint',
              'item.sermon_success',
          }
          required_rebalanced = {
              'rebalanced.tech.gratitude_effect',
              'rebalanced.tech.gratitude_lore',
              'rebalanced.tech.sin_shard_lore',
              'rebalanced.tech.souls_intro',
              'rebalanced.pulpit.souls_conversion',
              'rebalanced.active.sins_detailed',
              'rebalanced.repose.endpoint_bronze_hint',
          }
          for root in (Path('lang'), Path('lang_rebalanced')):
              files = sorted(root.glob('*.json'))
              assert len(files) == 11, (root, len(files))
              for path in files:
                  with path.open(encoding='utf-8') as fh:
                      data = json.load(fh)
                  if root.name == 'lang':
                      missing = sorted(required_base - set(data))
                      assert not missing, (path, missing)
                  if root.name == 'lang_rebalanced':
                      missing = sorted(required_rebalanced - set(data))
                      assert not missing, (path, missing)
          PY
      - name: Restore sibling projects
        run: |
          dotnet restore PrayerClarity.Rebalanced.csproj
          dotnet restore PrayerClarity.csproj
      - name: Build Rebalanced
        run: dotnet build PrayerClarity.Rebalanced.csproj -c Release --no-restore
      - name: Build Vanilla
        run: dotnet build PrayerClarity.csproj -c Release --no-restore
      - name: Verify locales and stage both runtime candidates
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          rebalanced='bin/Rebalanced/PrayerClarity.Rebalanced.dll'
          vanilla='bin/Release/PrayerClarity.dll'
          test -f "$rebalanced"
          test -f "$vanilla"

          for locale in en fr de zh_cn es pt_br ko ja ru it pl; do
            grep -a -q ".lang.${locale}.json" "$rebalanced"
            grep -a -q ".lang_rebalanced.${locale}.json" "$rebalanced"
            grep -a -q ".lang.${locale}.json" "$vanilla"
          done

          mkdir -p dist
          reb_handoff='PrayerClarity.Rebalanced-0.2.28-ci.dll'
          reb_canonical='PrayerClarity.Rebalanced.dll'
          van_handoff='PrayerClarity-1.0.37-ci.dll'
          van_canonical='PrayerClarity.dll'

          cp "$rebalanced" "dist/$reb_handoff"
          cp "$rebalanced" "dist/$reb_canonical"
          cp "$vanilla" "dist/$van_handoff"
          cp "$vanilla" "dist/$van_canonical"

          reb_hash=$(sha256sum "dist/$reb_handoff" | awk '{print $1}')
          reb_canonical_hash=$(sha256sum "dist/$reb_canonical" | awk '{print $1}')
          van_hash=$(sha256sum "dist/$van_handoff" | awk '{print $1}')
          van_canonical_hash=$(sha256sum "dist/$van_canonical" | awk '{print $1}')
          test "$reb_hash" = "$reb_canonical_hash"
          test "$van_hash" = "$van_canonical_hash"

          {
            echo "Source SHA: $GITHUB_SHA"
            echo "Supported game MVID: 6f50b8e7-156b-49ac-bbe8-7505894b2364"
            echo "Locales: en fr de zh_cn es pt_br ko ja ru it pl"
            echo
            echo "PrayerClarity: Vanilla"
            echo "Version: 1.0.37"
            echo "Handoff DLL: $van_handoff"
            echo "Canonical DLL: $van_canonical"
            echo "DLL SHA-256: $van_hash"
            echo
            echo "PrayerClarity: Rebalanced"
            echo "Version: 0.2.28"
            echo "Handoff DLL: $reb_handoff"
            echo "Canonical DLL: $reb_canonical"
            echo "DLL SHA-256: $reb_hash"
          } > dist/BUILD_INFO.txt

          echo "reb_handoff=$reb_handoff" >> "$GITHUB_OUTPUT"
          echo "reb_canonical=$reb_canonical" >> "$GITHUB_OUTPUT"
          echo "van_handoff=$van_handoff" >> "$GITHUB_OUTPUT"
          echo "van_canonical=$van_canonical" >> "$GITHUB_OUTPUT"
      - name: Upload shared runtime candidates
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-rebalanced-0.2.28-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.reb_handoff }}
            dist/${{ steps.artifact.outputs.reb_canonical }}
            dist/${{ steps.artifact.outputs.van_handoff }}
            dist/${{ steps.artifact.outputs.van_canonical }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
