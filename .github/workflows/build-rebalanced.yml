name: Build PrayerClarity Rebalanced candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/rebalanced-*'
      - '!candidate/rebalanced-test-console-*'

permissions:
  contents: read
  statuses: write

concurrency:
  group: prayerclarity-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate localization JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          required_rebalanced = {
              'rebalanced.tech.gratitude_intro',
              'rebalanced.tech.gratitude_lore',
              'rebalanced.tech.sin_shard_lore',
              'rebalanced.tech.souls_intro',
              'rebalanced.pulpit.souls_conversion',
          }
          for root in (Path('lang'), Path('lang_rebalanced')):
              files = sorted(root.glob('*.json'))
              assert len(files) == 11, (root, len(files))
              for path in files:
                  with path.open(encoding='utf-8') as fh:
                      data = json.load(fh)
                  if root.name == 'lang_rebalanced':
                      missing = sorted(required_rebalanced - set(data))
                      assert not missing, (path, missing)
          PY
      - name: Restore Rebalanced
        run: dotnet restore PrayerClarity.Rebalanced.csproj
      - name: Build Rebalanced
        run: dotnet build PrayerClarity.Rebalanced.csproj -c Release --no-restore
      - name: Verify locales and stage Rebalanced runtime candidate
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          rebalanced='bin/Rebalanced/PrayerClarity.Rebalanced.dll'
          test -f "$rebalanced"

          for locale in en fr de zh_cn es pt_br ko ja ru it pl; do
            grep -a -q ".lang.${locale}.json" "$rebalanced" || {
              echo "Rebalanced base locale marker missing: ${locale}" >&2
              exit 1
            }
            grep -a -q ".lang_rebalanced.${locale}.json" "$rebalanced" || {
              echo "Rebalanced overlay locale marker missing: ${locale}" >&2
              exit 1
            }
          done

          mkdir -p dist
          reb_handoff='PrayerClarity.Rebalanced-0.2.24-ci.dll'
          reb_canonical='PrayerClarity.Rebalanced.dll'
          cp "$rebalanced" "dist/$reb_handoff"
          cp "$rebalanced" "dist/$reb_canonical"

          reb_hash=$(sha256sum "dist/$reb_handoff" | awk '{print $1}')
          reb_canonical_hash=$(sha256sum "dist/$reb_canonical" | awk '{print $1}')
          test "$reb_hash" = "$reb_canonical_hash"

          {
            echo "Source SHA: $GITHUB_SHA"
            echo "Supported game MVID: 6f50b8e7-156b-49ac-bbe8-7505894b2364"
            echo "Locales: en fr de zh_cn es pt_br ko ja ru it pl"
            echo
            echo "PrayerClarity: Rebalanced"
            echo "Version: 0.2.24"
            echo "Handoff DLL: $reb_handoff"
            echo "Canonical DLL: $reb_canonical"
            echo "DLL SHA-256: $reb_hash"
          } > dist/BUILD_INFO.txt

          echo "reb_handoff=$reb_handoff" >> "$GITHUB_OUTPUT"
          echo "reb_canonical=$reb_canonical" >> "$GITHUB_OUTPUT"
          echo "reb_sha256=$reb_hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity: Rebalanced 0.2.24 DLL SHA-256: $reb_hash"
      - name: Upload Rebalanced runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-rebalanced-0.2.24-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.reb_handoff }}
            dist/${{ steps.artifact.outputs.reb_canonical }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
      - name: Report candidate workflow run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            cancelled) state=error ;;
            *) state=failure ;;
          esac
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="PrayerClarity Rebalanced candidate" \
            -f description="Rebalanced candidate workflow: $JOB_STATUS" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
