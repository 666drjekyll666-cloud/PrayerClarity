name: Publish accepted Rebalanced 0.2.16

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-rebalanced-0.2.16.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_SHA: d44bf75227f6efc1c4f09fb5cd3c4eaf3b9ee010
      REBALANCED_SHA256: 2ac89af8f517905fb859dbf496e9f16c098f9e75425b8ed03617927b27f75591
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download exact accepted artifact
        uses: actions/download-artifact@v4
        with:
          repository: NikichMods/PrayerClarity
          run-id: 35801691040
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-rebalanced-0.2.16-ci-d44bf75227f6efc1c4f09fb5cd3c4eaf3b9ee010
          path: accepted

      - name: Verify accepted bytes and stage canonical asset
        shell: bash
        run: |
          set -euo pipefail
          canonical='accepted/PrayerClarity.Rebalanced.dll'
          test -f "$canonical"
          actual=$(sha256sum "$canonical" | awk '{print $1}')
          test "$actual" = "$REBALANCED_SHA256"

          mkdir -p release
          cp "$canonical" release/PrayerClarity.Rebalanced.dll
          test "$(sha256sum release/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"

      - name: Publish Rebalanced 0.2.16 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rebalanced-v0.2.16 --repo NikichMods/PrayerClarity >/dev/null 2>&1; then
            echo 'rebalanced-v0.2.16 already exists; leaving it unchanged.'
          else
            gh release create rebalanced-v0.2.16 release/PrayerClarity.Rebalanced.dll \
              --repo NikichMods/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Rebalanced 0.2.16' \
              --latest=false \
              --notes "Accepted PrayerClarity: Rebalanced micro-release for Graveyard Keeper 1.407. Repose Gold and Excellence Gold now require 95 Church Quality for 100% sermon success instead of 90. All other prayer requirements, effects, durations, payouts, formulas and runtime mechanics are unchanged. This is the accepted premium-Gold soft-capstone design. Exact accepted executable source: d44bf75227f6efc1c4f09fb5cd3c4eaf3b9ee010. Exact DLL SHA-256: 2ac89af8f517905fb859dbf496e9f16c098f9e75425b8ed03617927b27f75591."
          fi
