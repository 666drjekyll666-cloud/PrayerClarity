# Frozen 0.1.2 test-harness candidate: synthetic timed-buff activation without normal sermon execution.
name: Build PrayerClarity test harness

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/test-harness-*'
    paths:
      - 'PrayerClarity.TestHarness.csproj'
      - 'src/PrayerClarityTestHarness.cs'
      - '.github/workflows/test-harness.yml'

permissions:
  contents: read

concurrency:
  group: prayerclarity-test-harness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.TestHarness.csproj
      - name: Build test harness DLL
        run: dotnet build PrayerClarity.TestHarness.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset='PrayerClarity.TestHarness.0.1.2.dll'
          cp 'bin/TestHarness/PrayerClarity.TestHarness.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "DLL: $asset"
            echo "SHA-256: $hash"
            echo "Supported game MVID: 6f50b8e7-156b-49ac-bbe8-7505894b2364"
          } > dist/BUILD_INFO.txt
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity Test Harness 0.1.2 SHA-256: $hash"
      - name: Upload test harness
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-TestHarness-0.1.2-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.asset }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
