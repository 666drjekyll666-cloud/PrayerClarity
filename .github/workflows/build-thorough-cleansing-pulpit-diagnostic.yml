name: Build Thorough Cleansing Pulpit Diagnostic

on:
  push:
    branches:
      - 'research/thorough-cleansing-pulpit-diagnostic-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prayerclarity-thorough-pulpit-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Verify artifact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.ThoroughCleansingPulpitDiagnostic.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.ThoroughCleansingPulpitDiagnostic.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/ThoroughCleansingPulpitDiagnostic/PrayerClarity.ThoroughCleansingPulpitDiagnostic.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.ThoroughCleansingPulpitDiagnostic-0.1.0.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo 'Version: 0.1.0'
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo 'Target: PrayerClarity: Rebalanced 0.2.25 / Graveyard Keeper 1.407'
            echo 'Purpose: read-only final-writer diagnostic for Gold Thorough Cleansing pulpit x2/x4 mismatch.'
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Diagnostic DLL SHA-256: $sha256"
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-thorough-cleansing-pulpit-diagnostic-0.1.0-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
