name: Build PrayerClarity Technology Tooltip Probe

on:
  push:
    branches:
      - 'research/technology-tooltip-probe-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-technology-tooltip-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.TechnologyTooltipProbe.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.TechnologyTooltipProbe.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/TechnologyTooltipProbe/PrayerClarity.TechnologyTooltipProbe.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.TechnologyTooltipProbe-0.1.0-ci.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo "Version: 0.1.0"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo "Target: PrayerClarity: Rebalanced 0.2.20 / Graveyard Keeper 1.407"
            echo "Purpose: read-only research probe for combined BSS Technology tooltip live row width, final bubble geometry, viewport fit and Harmony patch ownership."
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Technology Tooltip Probe DLL SHA-256: $sha256"
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-technology-tooltip-probe-0.1.0-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
