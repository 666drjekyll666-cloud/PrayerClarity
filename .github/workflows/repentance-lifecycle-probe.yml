name: Build PrayerClarity Repentance lifecycle probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/rework-audit-2026-09-16
    paths:
      - 'PrayerClarity.RepentanceLifecycleProbe.csproj'
      - 'src/PrayerClarityRepentanceLifecycleProbe.cs'
      - '.github/workflows/repentance-lifecycle-probe.yml'

permissions:
  contents: read

concurrency:
  group: prayerclarity-repentance-lifecycle-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.RepentanceLifecycleProbe.csproj
      - name: Build probe DLL
        run: dotnet build PrayerClarity.RepentanceLifecycleProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='PrayerClarity.RepentanceLifecycleProbe.0.1.1.dll'
          cp 'bin/RepentanceLifecycleProbe/PrayerClarity.RepentanceLifecycleProbe.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity Repentance lifecycle probe 0.1.1 SHA-256: $hash"
      - name: Upload probe DLL
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-RepentanceLifecycleProbe-0.1.1
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
