name: Build PrayerClarity lookup identity probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/rebalanced-1.0.20-baseline
    paths:
      - 'PrayerClarity.LookupIdentityProbe.csproj'
      - 'src/PrayerClarityLookupIdentityProbe.cs'
      - '.github/workflows/lookup-identity-probe.yml'

permissions:
  contents: read

concurrency:
  group: prayerclarity-lookup-identity-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.LookupIdentityProbe.csproj
      - name: Build probe DLL
        run: dotnet build PrayerClarity.LookupIdentityProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          mkdir -p dist
          asset='PrayerClarity.LookupIdentityProbe.0.1.0.dll'
          cp 'bin/LookupIdentityProbe/PrayerClarity.LookupIdentityProbe.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "PrayerClarity lookup identity probe 0.1.0 SHA-256: $hash"
      - name: Upload probe DLL
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-LookupIdentityProbe-0.1.0
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
