name: Build PrayerClarity pulpit layout probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'candidate/pulpit-layout-probe-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-pulpit-layout-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.PulpitLayoutProbe.csproj
      - name: Build read-only layout probe
        run: dotnet build PrayerClarity.PulpitLayoutProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/PulpitLayoutProbe/PrayerClarity.PulpitLayoutProbe.dll'
          test -f "$dll"
          mkdir -p dist
          asset='PrayerClarity.PulpitLayoutProbe.0.1.0.dll'
          cp "$dll" "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "DLL: $asset"
            echo "SHA-256: $hash"
            echo "Supported game MVID: 6f50b8e7-156b-49ac-bbe8-7505894b2364"
            echo "Purpose: read-only pulpit UI geometry/font-symbol diagnostic"
          } > dist/BUILD_INFO.txt
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-PulpitLayoutProbe-0.1.0-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.asset }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
