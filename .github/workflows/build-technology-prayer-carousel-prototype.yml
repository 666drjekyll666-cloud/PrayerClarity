name: Build PrayerClarity Technology Prayer Carousel Prototype

on:
  push:
    branches:
      - 'research/bss-technology-prayer-carousel-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-tech-prayer-carousel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.TechnologyPrayerCarouselPrototype.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.TechnologyPrayerCarouselPrototype.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/TechnologyPrayerCarouselPrototype/PrayerClarity.TechnologyPrayerCarouselPrototype.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.TechnologyPrayerCarouselPrototype-0.1.0.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo 'Version: 0.1.0'
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo 'Target: PrayerClarity: Rebalanced 0.2.21 candidate source 1d8eb667d4ddbc37efd24cbd84606f1a43e19606 / Graveyard Keeper 1.407'
            echo 'Purpose: research-only UI prototype. Keeps the existing BSS Technology node focused; X/Y cycles its three existing TechUnlock tooltips while D-pad tree navigation remains untouched.'
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Technology Prayer Carousel Prototype DLL SHA-256: $sha256"
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-technology-prayer-carousel-prototype-0.1.0-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
