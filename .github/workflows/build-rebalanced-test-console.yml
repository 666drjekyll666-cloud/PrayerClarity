name: Build PrayerClarity Rebalanced Test Console

on:
  push:
    branches:
      - 'candidate/rebalanced-test-console-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-rebalanced-test-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.RebalancedTestConsole.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.RebalancedTestConsole.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/RebalancedTestConsole/PrayerClarity.RebalancedTestConsole.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.RebalancedTestConsole-0.1.6-ci.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo "Version: 0.1.6"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo "Target: PrayerClarity: Rebalanced 0.2.18 source 449748ceb9f50c873e15dede485315912ca9935c / Graveyard Keeper 1.407"
            echo "Purpose: research-only F1 console for native BuffsLogics AddBuff/RemoveBuff activation of timed prayer effects without using the pulpit."
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
      - name: Upload research candidate
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-RebalancedTestConsole-0.1.6-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
