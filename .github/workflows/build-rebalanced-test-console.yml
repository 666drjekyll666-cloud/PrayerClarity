name: Build PrayerClarity Rebalanced Test Console

on:
  push:
    branches:
      - 'candidate/rebalanced-test-console-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prayerclarity-rebalanced-test-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Verify artifact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.RebalancedTestConsole.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.RebalancedTestConsole.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/RebalancedTestConsole/PrayerClarity.RebalancedTestConsole.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.RebalancedTestConsole-0.1.10-ci.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo "Version: 0.1.10"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo "Target: PrayerClarity: Rebalanced 0.2.25 source 3f5d4feef3b50de048ab3eec1d2e9a9388182340 / Graveyard Keeper 1.407"
            echo "Purpose: research-only F1 console with native prayer probes, a verified player-facing prayer-item gallery, reversible temporary player inventory expansion, native any-day pulpit opening, and a prayer-title quality-glyph visual probe."
            echo "Save safety: gallery items and temporary inventory capacity are save-persistent; remove spawned items and restore original inventory size before saving a permanent playthrough state."
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Rebalanced Test Console 0.1.10 DLL SHA-256: $sha256"
      - name: Upload research candidate
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-RebalancedTestConsole-0.1.10-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
