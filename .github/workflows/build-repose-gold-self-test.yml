name: Build PrayerClarity Repose Gold Self-Test

on:
  push:
    branches:
      - 'candidate/repose-gold-self-test-*'

permissions:
  contents: read

concurrency:
  group: prayerclarity-repose-gold-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.ReposeGoldSelfTest.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.ReposeGoldSelfTest.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/ReposeGoldSelfTest/PrayerClarity.ReposeGoldSelfTest.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.ReposeGoldSelfTest-0.1.1-ci.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo "Version: 0.1.1"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo "Target production candidate: PrayerClarity: Rebalanced 0.2.15"
            echo "Target production source SHA: ac953fe25ef17dbaf63340a7b9309dadec7e207e"
            echo "Purpose: research-only one-button runtime verification of the Repose Gold maximum-skull GenerateBody path."
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
      - name: Upload research candidate
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-ReposeGoldSelfTest-0.1.1-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
