name: Publish accepted PrayerClarity sibling releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-1.0.25-rebalanced-0.2.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VANILLA_ACCEPTED_SHA: ebe069b4ad202ae786af9c63ded0ffb00502cff7
      REBALANCED_ACCEPTED_SHA: 26048581c3fe6e0d8ef4ae930a0c29474f68bbcf
      VANILLA_SHA256: 72b2237607734d8b50d666cef56e18d458b88c6a456211d496e2410ac646e3a9
      REBALANCED_SHA256: 84cf07be553e137d4663d24267ab18257facfbe44c0a833d87579876742b6de1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download exact accepted Vanilla artifact
        uses: actions/download-artifact@v4
        with:
          repository: 666drjekyll666-cloud/PrayerClarity
          run-id: 35347730945
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-1.0.25-ci-ebe069b4ad202ae786af9c63ded0ffb00502cff7
          path: accepted-vanilla

      - name: Download exact accepted Rebalanced artifact
        uses: actions/download-artifact@v4
        with:
          repository: 666drjekyll666-cloud/PrayerClarity
          run-id: 35346055221
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-shared-ui-1.0.24-rebalanced-0.2.0-ci-26048581c3fe6e0d8ef4ae930a0c29474f68bbcf
          path: accepted-rebalanced

      - name: Verify accepted bytes and stage canonical assets
        shell: bash
        run: |
          set -euo pipefail

          vanilla='accepted-vanilla/PrayerClarity-1.0.25-ci.dll'
          rebalanced='accepted-rebalanced/PrayerClarity.Rebalanced-0.2.0-ci.dll'
          test -f "$vanilla"
          test -f "$rebalanced"

          vanilla_actual=$(sha256sum "$vanilla" | awk '{print $1}')
          rebalanced_actual=$(sha256sum "$rebalanced" | awk '{print $1}')
          test "$vanilla_actual" = "$VANILLA_SHA256"
          test "$rebalanced_actual" = "$REBALANCED_SHA256"

          mkdir -p release
          cp "$vanilla" release/PrayerClarity.dll
          cp "$rebalanced" release/PrayerClarity.Rebalanced.dll

          test "$(sha256sum release/PrayerClarity.dll | awk '{print $1}')" = "$VANILLA_SHA256"
          test "$(sha256sum release/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"

      - name: Publish Rebalanced 0.2.0 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rebalanced-v0.2.0 --repo 666drjekyll666-cloud/PrayerClarity >/dev/null 2>&1; then
            echo 'rebalanced-v0.2.0 already exists; leaving it unchanged.'
          else
            gh release create rebalanced-v0.2.0 release/PrayerClarity.Rebalanced.dll \
              --repo 666drjekyll666-cloud/PrayerClarity \
              --target "$REBALANCED_ACCEPTED_SHA" \
              --title 'PrayerClarity: Rebalanced 0.2.0' \
              --latest=false \
              --notes "Accepted PrayerClarity: Rebalanced release for Graveyard Keeper 1.407. Reworks the prayer roster around clearer specialist/generalist roles: flat Faith and Donations specialists, percentage-only Combo scaling, revised Church Quality ladders, q120 Gold Soul's Repose, tuned timed prayers, and safe best-existing-tier Repose handling. Adds current Soul Gratitude to the pulpit context and keeps all 11 supported interface languages. Exact accepted DLL SHA-256: 84cf07be553e137d4663d24267ab18257facfbe44c0a833d87579876742b6de1."

      - name: Publish Vanilla 1.0.25 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.25 --repo 666drjekyll666-cloud/PrayerClarity >/dev/null 2>&1; then
            echo 'v1.0.25 already exists; leaving it unchanged.'
          else
            gh release create v1.0.25 release/PrayerClarity.dll \
              --repo 666drjekyll666-cloud/PrayerClarity \
              --target "$VANILLA_ACCEPTED_SHA" \
              --title 'PrayerClarity: Vanilla 1.0.25' \
              --latest \
              --notes "Accepted PrayerClarity: Vanilla release for Graveyard Keeper 1.407. Adds current Soul Gratitude to the Soul's Repose pulpit context and contextual Repose endpoint wording while preserving stock prayer mechanics and balance. Includes all 11 supported interface languages. Exact accepted DLL SHA-256: 72b2237607734d8b50d666cef56e18d458b88c6a456211d496e2410ac646e3a9."
