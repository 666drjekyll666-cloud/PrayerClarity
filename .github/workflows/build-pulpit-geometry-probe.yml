name: Build Pulpit Geometry Probe

on:
  push:
    branches:
      - 'research/pulpit-geometry-probe-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prayerclarity-pulpit-geometry-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Verify source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.PulpitGeometryProbe.csproj
      - name: Build Release DLL
        run: dotnet build PrayerClarity.PulpitGeometryProbe.csproj -c Release --no-restore
      - name: Stage research DLL
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          dll='bin/PulpitGeometryProbe/PrayerClarity.PulpitGeometryProbe.dll'
          test -f "$dll"
          mkdir -p dist
          handoff='PrayerClarity.PulpitGeometryProbe-0.1.0-ci.dll'
          cp "$dll" "dist/$handoff"
          sha256=$(sha256sum "dist/$handoff" | awk '{print $1}')
          {
            echo "Version: 0.1.0"
            echo "Source SHA: $GITHUB_SHA"
            echo "Handoff DLL: $handoff"
            echo "DLL SHA-256: $sha256"
            echo "Target production candidate: PrayerClarity: Rebalanced 0.2.33"
            echo "Question: which post-render NGUI bounds are actually present for the Effect label, craft button widgets, anchored container and root window, and why did 0.2.33 not request root-window growth?"
            echo "Behavior: read-only F8 geometry dump; no Harmony patches; no UI/game/save mutation."
          } > dist/BUILD_INFO.txt
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"
      - name: Upload research DLL
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-PulpitGeometryProbe-0.1.0-ci-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.handoff }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
