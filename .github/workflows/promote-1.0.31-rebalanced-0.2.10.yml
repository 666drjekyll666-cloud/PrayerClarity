name: Publish accepted PrayerClarity sibling releases

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-1.0.31-rebalanced-0.2.10.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_SHA: 30b036f16dc6a7964f7ef72e2e3ececa5951c812
      VANILLA_SHA256: 140a2b3bc21eaa0b9e95f344a8a9ab5f47d5b9aa37572a0b159d905c79351ba3
      REBALANCED_SHA256: 1f7131bda66554bb18396bed28a5997a531c2a0b9a44df1a61071d2c7e9b78e1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download exact accepted sibling artifact
        uses: actions/download-artifact@v4
        with:
          repository: 666drjekyll666-cloud/PrayerClarity
          run-id: 35475014644
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-shared-ui-1.0.31-rebalanced-0.2.10-ci-30b036f16dc6a7964f7ef72e2e3ececa5951c812
          path: accepted

      - name: Verify accepted bytes and stage canonical assets
        shell: bash
        run: |
          set -euo pipefail

          vanilla='accepted/PrayerClarity-1.0.31-ci.dll'
          rebalanced='accepted/PrayerClarity.Rebalanced-0.2.10-ci.dll'
          test -f "$vanilla"
          test -f "$rebalanced"

          vanilla_actual=$(sha256sum "$vanilla" | awk '{print $1}')
          rebalanced_actual=$(sha256sum "$rebalanced" | awk '{print $1}')
          test "$vanilla_actual" = "$VANILLA_SHA256"
          test "$rebalanced_actual" = "$REBALANCED_SHA256"

          mkdir -p release
          cp "$vanilla" release/PrayerClarity.dll
          cp "$rebalanced" release/PrayerClarity.Rebalanced.dll

          test "$(sha256sum release/PrayerClarity.dll | awk '{print $1}')" = "$VANILLA_SHA256"
          test "$(sha256sum release/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"

      - name: Publish Rebalanced 0.2.10 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rebalanced-v0.2.10 --repo 666drjekyll666-cloud/PrayerClarity >/dev/null 2>&1; then
            echo 'rebalanced-v0.2.10 already exists; leaving it unchanged.'
          else
            gh release create rebalanced-v0.2.10 release/PrayerClarity.Rebalanced.dll \
              --repo 666drjekyll666-cloud/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Rebalanced 0.2.10' \
              --latest=false \
              --notes "Accepted PrayerClarity: Rebalanced release for Graveyard Keeper 1.407. Carries the shared Clarity tooltip cleanup through item, Technology, pulpit and Temporary Effects surfaces; restores the stock Prayer for Excellence lore on the multi-quality crafting path; keeps the Roots 95% aggregate cap on the active-effect surface while removing it from prayer-selection text; and raises ordinary Repose Gold's guaranteed-success Church Quality requirement from 50 to 60 while preserving its accepted corpse-quality behavior and 30/42/54-minute durations. Exact accepted runtime source: 30b036f16dc6a7964f7ef72e2e3ececa5951c812. Exact DLL SHA-256: 1f7131bda66554bb18396bed28a5997a531c2a0b9a44df1a61071d2c7e9b78e1."
          fi

      - name: Publish Vanilla 1.0.31 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.31 --repo 666drjekyll666-cloud/PrayerClarity >/dev/null 2>&1; then
            echo 'v1.0.31 already exists; leaving it unchanged.'
          else
            gh release create v1.0.31 release/PrayerClarity.dll \
              --repo 666drjekyll666-cloud/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Vanilla 1.0.31' \
              --latest \
              --notes "Accepted PrayerClarity: Vanilla release for Graveyard Keeper 1.407. Refines prayer-item and Technology clarity with compact Base result dependencies, cleaner success-only rows, atomic item rewards, and visible item-tooltip section spacing; restores the stock Prayer for Excellence lore where Graveyard Keeper's multi-quality crafting path omitted it; and preserves stock prayer gameplay mechanics and balance. Exact accepted runtime source: 30b036f16dc6a7964f7ef72e2e3ececa5951c812. Exact DLL SHA-256: 140a2b3bc21eaa0b9e95f344a8a9ab5f47d5b9aa37572a0b159d905c79351ba3."
          fi
