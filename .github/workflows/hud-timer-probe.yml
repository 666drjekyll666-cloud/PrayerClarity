name: Build PrayerClarity HUD timer probe

on:
  workflow_dispatch:
  push:
    branches:
      - 'research/hud-prayer-timer-probe'
    paths:
      - 'PrayerClarity.HudProbe.csproj'
      - 'src/PrayerClarityHudTimerProbe.cs'
      - '.github/workflows/hud-timer-probe.yml'

permissions:
  contents: read

concurrency:
  group: prayerclarity-hud-timer-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PrayerClarity.HudProbe.csproj
      - name: Build probe DLL
        run: dotnet build PrayerClarity.HudProbe.csproj -c Release --no-restore
      - name: Stage artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset='PrayerClarity.HudTimerProbe-0.1.0.dll'
          cp 'bin/HudProbe/PrayerClarity.HudProbe.dll' "dist/$asset"
          hash=$(sha256sum "dist/$asset" | awk '{print $1}')
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "DLL: $asset"
            echo "SHA-256: $hash"
            echo "Purpose: read-only Graveyard Keeper 1.407 BuffIcon/HUD timer label ownership, font and geometry audit"
          } > dist/BUILD_INFO.txt
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "HUD probe SHA-256: $hash"
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: PrayerClarity-HudTimerProbe-0.1.0-${{ github.sha }}
          path: |
            dist/${{ steps.artifact.outputs.asset }}
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
