name: Publish accepted Rebalanced 0.2.38

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-rebalanced-0.2.38.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ACCEPTED_SHA: 6f5ef168810945135cee57082cbf90d31776e46b
      REBALANCED_SHA256: e547f7bb76e0ef512dc669ea30543dada5a2aeb8044b1c7ffcbe7fecf17303e5
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Download exact accepted artifact
        uses: actions/download-artifact@v4
        with:
          repository: NikichMods/PrayerClarity
          run-id: 36245784593
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: PrayerClarity-rebalanced-0.2.38-ci-6f5ef168810945135cee57082cbf90d31776e46b
          path: accepted

      - name: Verify accepted bytes and stage canonical asset
        shell: bash
        run: |
          set -euo pipefail
          handed='accepted/PrayerClarity.Rebalanced-0.2.38-ci.dll'
          test -f "$handed"
          actual=$(sha256sum "$handed" | awk '{print $1}')
          test "$actual" = "$REBALANCED_SHA256"

          mkdir -p release
          cp "$handed" release/PrayerClarity.Rebalanced.dll
          test "$(sha256sum release/PrayerClarity.Rebalanced.dll | awk '{print $1}')" = "$REBALANCED_SHA256"

      - name: Publish Rebalanced 0.2.38 without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          if gh release view rebalanced-v0.2.38 --repo NikichMods/PrayerClarity >/dev/null 2>&1; then
            echo 'rebalanced-v0.2.38 already exists; leaving it unchanged.'
          else
            gh release create rebalanced-v0.2.38 release/PrayerClarity.Rebalanced.dll \
              --repo NikichMods/PrayerClarity \
              --target "$ACCEPTED_SHA" \
              --title 'PrayerClarity: Rebalanced 0.2.38' \
              --latest=false \
              --notes "Accepted PrayerClarity: Rebalanced release for Graveyard Keeper 1.407. Includes the accepted prayer-item, Technology and pulpit presentation refinements since 0.2.23, robust long-localization pulpit layout and live language-font refresh, Gold-only Shoots & Roots 95% combined-cap wording, native 1-gold presentation for Gold Donations at the pulpit, and the parenthetical Soul's Repose reliability note. Prayer mechanics and the accepted Rebalanced balance roster are unchanged by the final 0.2.38 presentation pass. Exact accepted runtime source: 6f5ef168810945135cee57082cbf90d31776e46b. Exact DLL SHA-256: e547f7bb76e0ef512dc669ea30543dada5a2aeb8044b1c7ffcbe7fecf17303e5."
          fi
